{const p=[],r=27.43;for(let i=0;i<=64;i++){const a=Math.PI+i/64*Math.PI;p.push(new THREE.Vector3(Math.cos(a)*r,0.01,-10.06+Math.sin(a)*r))}for(let i=0;i<=64;i++){const a=i/64*Math.PI;p.push(new THREE.Vector3(Math.cos(a)*r,0.01,10.06+Math.sin(a)*r))}

{const N=2600;const geo=new THREE.BoxGeometry(1,1,1);geo.translate(0,.5,0);const inst=new THREE.InstancedMesh(geo,new THREE.MeshStandardMaterial({color:0x0b0e16,roughness:1}),N);const m=new THREE.Matrix4();

const sunTex=canvasTex(512,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#ffc24a');gr.addColorStop(.5,'#ff8a1a');gr.addColorStop(1,'#e85a00');g.fillStyle=gr;g.fillRect(0,0,w,h);for(let i=0;i<900;i++){g.fillStyle=`rgba(255,${200+rnd()*55|0},120,${rnd()*.35})`;g.beginPath();g.arc(rnd()*w,rnd()*h,1+rnd()*5,0,7);g.fill()}});

{const e=new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.1108,1));sunG.add(new THREE.LineSegments(e,new THREE.LineBasicMaterial({color:0x5a1e00,transparent:true,opacity:.9})))}

{const m=new THREE.LineBasicMaterial({color:0xff9933,transparent:true,opacity:1});const pts=[EP.clone().add(new THREE.Vector3(0,-0.0018,0)),MP.clone().add(new THREE.Vector3(0,-0.0018,0))];ruler.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),m));
 for(let i=0;i<=6;i++){const z=i/6*0.061;const p=[EP.clone().add(new THREE.Vector3(0,-0.0018,z)),EP.clone().add(new THREE.Vector3(0,-0.0018-(i%3==0?0.002:0.001),z))];ruler.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),m))}}

const cam2=new THREE.PerspectiveCamera(40,W/H,0.001,100);

{const N=3000,p=[];for(let i=0;i<N;i++){const v=new THREE.Vector3(rnd()*2-1,rnd()*2-1,rnd()*2-1).normalize().multiplyScalar(40+rnd()*20);p.push(v.x,v.y,v.z)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));var starsM=new THREE.PointsMaterial({size:2,sizeAttenuation:false,color:0xffffff,map:dotTex,transparent:true,opacity:.7,depthWrite:false});sc2.add(new THREE.Points(g,starsM))}

];
function camAt(t){
 if(t>=S.loop+.35){const k=K[0];return pose(k.tg,lerp(2.1,1.5,ramp(t,S.loop+.35,END)),lerp(10,28,ramp(t,S.loop+.35,END)),9,40)}
 let i=0;while(i<K.length-1&&t>K[i+1].t)i++;
 const a=K[i],b=K[Math.min(i+1,K.length-1)];const k=b===a?0:ease((t-a.t)/(b.t-a.t));
 const tg=a.tg.clone().lerp(b.tg,k);const d=Math.exp(lerp(Math.log(a.d),Math.log(b.d),k));
 return pose(tg,d,lerp(a.az,b.az,k),lerp(a.el,b.el,k),40);
}
function pose(tg,d,az,el,fov){const A=az*Math.PI/180,E=el*Math.PI/180;cam.position.set(tg.x+d*Math.cos(E)*Math.cos(A),tg.y+d*Math.sin(E),tg.z+d*Math.cos(E)*Math.sin(A));cam.near=Math.max(d*0.002,0.00002);cam.far=Math.max(d*40,5000);cam.fov=fov;cam.updateProjectionMatrix();cam.lookAt(tg)}

// ================= UI helpers
function proj(v,c){const p=v.clone().project(c);return {x:(p.x+1)/2*W,y:(1-p.y)/2*H,z:p.z}}
function setHud(id,world,c,text,alpha,side){const el=$(id);if(alpha<=0.01){el.style.opacity=0;return}const p=proj(world,c);let x=clamp(p.x,140,520),y=clamp(p.y,680,1050);el.style.left=x+'px';el.style.top=y+'px';el.style.opacity=alpha;el.className='hud';el.querySelector('span').innerHTML=text;const s=1+0.25*(1-clamp(alpha*1.5));el.style.transform=`scale(${s})`}
function big(label,num,sub,alpha){const b=$('big');b.style.opacity=alpha;$('bigLabel').textContent=label;$('bigNum').innerHTML=num;$('bigSub').textContent=sub;b.style.transform=`translateY(${(1-alpha)*30}px)`}
// caption chunks
const CH=[];
for(const l of TL.lines){const words=l.cap.split(' ');const lines=[];let cur='';for(const w of words){if((cur+' '+w).trim().length>22){lines.push(cur.trim());cur=w}else cur+=' '+w}if(cur.trim())lines.push(cur.trim());
 const chunks=[];for(let i=0;i<lines.length;i+=2)chunks.push(lines.slice(i,i+2));const tot=chunks.reduce((s,c)=>s+c.join('').length,0);let t0=l.start;
 for(const c of chunks){const dt=l.dur*c.join('').length/tot;CH.push({a:t0,b:t0+dt,html:c.join('<br>')});t0+=dt}}
const fmt=(x,dp=1)=>x.toFixed(dp);

window.seek=function(t){
 // ---- stadium
 const r=camAt(t);
 sunG.rotation.y=t*0.25;
 earth.rotation.y=2.2+t*0.3; moon.rotation.y=t*0.2; jup.rotation.y=t*0.5;
 const sp=1+0.04*Math.sin(t*3);sg1.scale.set(.75*sp,.75*sp,1);
 // measure line
 const mk=ramp(t,S.dist+0.2,S.dist+3.2), mvis=win(t,S.dist,S.moon+.4,.4);
 const head=SUNP.clone().setY(0.03).lerp(EP.clone().setY(0.03),mk);meas.scale.x=Math.max(0.001,23.6*mk);meas.material.opacity=mvis;measHead.position.copy(head);measHead.material.opacity=mvis;
 orbE.material.opacity=0.9*(win(t,S.dist+2.6,S.moon+.3,.4)+win(t,S.jup+.8,S.nep+1,.5));
 yard.material.opacity=0.45+0.5*win(t,S.dist+2.6,S.dist+4.8,.4)*(0.5+0.5*Math.sin(t*10));
 ruler.children.forEach(c=>c.material.opacity=win(t,S.moon+.6,S.jup+.2));
 orbJ.material.opacity=0.9*win(t,S.jup+1.2,S.star+1,.6);markJ.material.opacity=0.8*win(t,S.jup+1.2,S.nep+.6,.4);
 orbN.material.opacity=0.9*win(t,S.nep+.6,S.star+1.4,.5);markN.material.opacity=0.8*win(t,S.nep+.8,S.star+1,.4);
 R1.render(sc,cam);
 // ---- globe
 const gA=ramp(t,S.star+0.6,S.star+1.6)*(1-ramp(t,S.loop+.1,S.loop+.35));
 $('c2').style.opacity=gA;
 if(gA>0){
  const nM=pM.clone().normalize(),mid=pM.clone().add(pD).normalize();
  const k1=ramp(t,S.star+0.3,S.star+3.6),k2=ramp(t,S.dark-.2,S.cta+3);
  const dir=nM.clone().lerp(mid,k1).normalize();const dist=Math.exp(lerp(Math.log(1.7),Math.log(4.0),k1))*lerp(1,1.9,k2);
  cam2.position.copy(dir.multiplyScalar(dist));cam2.up.set(0,1,0);const midS=pM.clone().add(pD).multiplyScalar(.5);cam2.lookAt(pM.clone().lerp(midS.multiplyScalar(.9),k1).add(V(0,-0.32*k1,0)));
  const ak=ramp(t,S.star+2.0,S.star+4.6);arcG.setDrawRange(0,Math.max(2,Math.floor(ak*ARCN)));arc.material.opacity=ak>0?1:0;
  ballD.material.opacity=ballD2.material.opacity=ramp(t,S.star+4.4,S.star+4.9);
  const dim=1-0.88*ramp(t,S.dark,S.dark+1.2);globe.material.opacity=dim;globe.material.emissiveIntensity=1.1*dim;atm.material.opacity=.35*dim;
  arc.material.opacity*=lerp(1,.25,ramp(t,S.dark,S.dark+1.2));
  R2.render(sc2,cam2);
 }
 // ---- UI
 $('tag').style.opacity=1;
 // big text
 let B=null;
 const segs=[
  [S.hook+.05,S.sun-.1,'AGAR SOORAJ','football<small>hota…</small>','toh Dharti kahan hoti?'],
  [S.sun+1.0,S.earth-.05,'SOORAJ','22<small>cm</small>','ek football'],
  [S.earth+1.3,S.dist,'DHARTI','2<small>mm</small>','raai ka daana'],
  [S.dist+.3,S.moon,'DOORI','D','30-yard circle ke andar'],
  [S.moon+1.0,S.jup,'CHAAND','0.5<small>mm</small>',''],
  [S.jup+1.4,S.nep,'JUPITER','123<small>m</small>','ek kancha · 2.3 cm'],
  [S.nep+.8,S.star+.3,'NEPTUNE','711<small>m</small>','stadium se bahut door'],
  [S.star+2.4,S.dark,'AGLA TAARA','K','ek aur football'],
  [S.dark+.2,S.cta-.05,'BEECH MEIN','0','kuch nahi. bas andhera.'],
 ];
 for(const s of segs){if(t>=s[0]&&t<s[1]){B=s;break}}
 if(B){let num=B[3];const a=win(t,B[0],B[1],.3);
  if(num==='D'){num=fmt(23.6*ramp(t,S.dist+0.2,S.dist+3.2))+'<small>m</small>'}
  if(num==='K'){num=Math.round(6354*ramp(t,S.star+2.4,S.star+4.6)).toLocaleString('en-IN')+'<small>km</small>'}
  big(B[2],num,B[4],a);
 } else $('big').style.opacity=0;
 // HUD
 if(t<S.moon){const hA=win(t,S.sun+1.2,S.earth+.6,.3);setHud('hudA',SUNP,cam,'SOORAJ · 22 cm',hA,'right')}else setHud('hudA',EP,cam,'DHARTI',win(t,S.moon+1.0,S.jup+.2,.25),'right');
 let hb=0,hbT='',hbP=EP,side='right';
 if(t>S.earth+1.1&&t<S.dist+.3){hb=win(t,S.earth+1.1,S.dist+.3,.25);hbT='DHARTI · 2 mm';hbP=EP}
 else if(t>S.dist+1.2&&t<S.moon+.2){hb=win(t,S.dist+1.2,S.moon+.2,.25);hbT='DHARTI';hbP=EP}
 else if(t>S.moon+1.0&&t<S.jup+.2){hb=win(t,S.moon+1.0,S.jup+.2,.25);hbT='CHAAND · 0.5 mm';hbP=MP;side='left'}
 else if(t>S.jup+1.6&&t<S.nep+.2){hb=win(t,S.jup+1.6,S.nep+.2,.25);hbT='JUPITER';hbP=JP}
 else if(t>S.nep+1.0&&t<S.star+.6){hb=win(t,S.nep+1.0,S.star+.6,.25);hbT='NEPTUNE';hbP=NP;side='left'}
 else if(t>S.star+4.5&&t<S.dark+.4){hb=win(t,S.star+4.5,S.dark+.4,.25);hbT='AGLA TAARA';hbP=pD;side='right'}
 setHud('hudB',hbP,hbP===pD?cam2:cam,hbT,hb,side);
 if(t<S.earth+.6&&t>S.dist-1){}
 // chip (mid nudge ~40%)
 const ca=win(t,S.moon+.15,S.moon+1.75,.25);$('chip').style.opacity=ca;$('chip').style.transform=`translateX(-50%) scale(${0.85+0.15*ramp(t,S.moon+.15,S.moon+.45)+0.03*Math.sin(t*14)})`;
 // cta
 const cA=win(t,S.cta-.1,S.loop+.15,.3);const cta=$('cta');cta.style.opacity=cA;cta.style.transform=`scale(${0.9+0.1*ramp(t,S.cta-.1,S.cta+.3)})`;
 const pk=((t-S.cta)%1.6)/1.6;$('plane').style.transform=`translate(${Math.sin(pk*Math.PI*2)*14}px,${-Math.abs(Math.sin(pk*Math.PI*2))*10}px) rotate(${Math.sin(pk*Math.PI*2)*6}deg)`;
 // captions
 const c=CH.find(c=>t>=c.a&&t<c.b+0.12);const ci=$('capIn');if(c){ci.parentNode.style.opacity=1;ci.innerHTML=c.html}else ci.parentNode.style.opacity=0;
 // black dip for loop
 $('black').style.opacity=win(t,S.loop+.05,S.loop+.65,.3)*1 + (t<0.12?1-t/0.12:0)*0;
 return true;
};
