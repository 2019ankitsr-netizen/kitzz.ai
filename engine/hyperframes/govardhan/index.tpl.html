<!doctype html>
<html lang="hi" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<title>Govardhan - kitzz.ai</title>
<script src="gsap.min.js"></script>
<script src="timings.js"></script>
<style>
@font-face { font-family: "Hind"; src: url("fonts/Hind-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Hind"; src: url("fonts/Hind-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "Yatra"; src: url("fonts/YatraOne-Regular.ttf"); }
html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #120a1c; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Hind", sans-serif; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.title { position: absolute; left: 65px; width: 950px; top: 300px; text-align: center; font-family: "Yatra"; font-size: 110px; line-height: 1.15;
  color: #ffe2a6; text-shadow: 0 6px 24px rgba(0,0,0,.55); opacity: 0; }
.sub { position: absolute; left: 65px; width: 950px; top: 440px; text-align: center; font-family: "Hind"; font-weight: 600; font-size: 40px;
  letter-spacing: 6px; color: #fff3d6; text-shadow: 0 3px 12px rgba(0,0,0,.6); opacity: 0; }
.cap { position: absolute; left: 110px; width: 820px; top: 1070px; text-align: center; font-family: "Hind"; font-weight: 700; font-size: 50px;
  line-height: 1.28; color: #ffffff; opacity: 0; }
.cap span.box { background: rgba(14, 8, 24, .78); padding: 10px 26px; border-radius: 22px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.cap b { color: #ffc65c; }
#counter { position: absolute; left: 65px; width: 950px; top: 290px; text-align: center; opacity: 0; }
#counter .num { font-family: "Yatra"; font-size: 150px; color: #ffd27a; line-height: 1; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
#counter .lab { font-family: "Hind"; font-weight: 600; font-size: 40px; letter-spacing: 8px; color: #e9ddff; }
.dn { position: absolute; left: 0; width: 100%; opacity: 0; }
#nudge { position: absolute; left: 90px; top: 1262px; height: 130px; border-radius: 65px; padding: 0 50px 0 36px; display: flex; align-items: center; gap: 22px;
  background: #ffc65c; color: #2a1606; font-family: "Hind"; font-weight: 700; font-size: 62px; opacity: 0; box-shadow: 0 8px 0 rgba(0,0,0,.25); }
#nudge.inv { background: #2a1606; color: #ffc65c; }
#cta { position: absolute; left: 90px; top: 560px; width: 810px; height: 440px; border-radius: 44px; background: #fff6e4; opacity: 0;
  box-shadow: 0 14px 0 rgba(0,0,0,.25); }
#cta .h { position: absolute; left: 190px; top: 70px; font-family: "Hind"; font-weight: 700; font-size: 80px; color: #b23a12; }
#cta .b { position: absolute; left: 60px; top: 200px; width: 700px; font-family: "Hind"; font-weight: 700; font-size: 52px; color: #2a1606; line-height: 1.3; }
</style>
</head>
<body>
<div id="root" data-composition-id="govardhan" data-width="1080" data-height="1920" data-start="0" data-duration="{{DUR}}">
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1446"/><stop offset=".45" stop-color="#8e3b5a"/><stop offset=".75" stop-color="#e3874f"/><stop offset="1" stop-color="#f6c37a"/></linearGradient>
    <linearGradient id="gStorm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset=".6" stop-color="#1c2640"/><stop offset="1" stop-color="#344262"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf7d"/><stop offset=".6" stop-color="#f6a660"/><stop offset="1" stop-color="#f3d39a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cbf5a"/><stop offset="1" stop-color="#2f6b3a"/></linearGradient>
    <linearGradient id="gEarth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a22"/><stop offset="1" stop-color="#160c12"/></linearGradient>
    <radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2c4" stop-opacity=".9"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></radialGradient>
    <g id="tree"><rect x="-5" y="-40" width="10" height="40" fill="#5b3a24"/><circle cx="0" cy="-58" r="28" fill="#3f8f45"/><circle cx="-16" cy="-44" r="18" fill="#357d3c"/><circle cx="16" cy="-46" r="18" fill="#4aa150"/></g>
    <g id="hut"><rect x="-46" y="-60" width="92" height="60" fill="#c98a4b"/><polygon points="-62,-58 0,-112 62,-58" fill="#8a4a2a"/><rect x="-14" y="-38" width="28" height="38" fill="#4a2414"/></g>
    <g id="cow"><ellipse cx="0" cy="-44" rx="46" ry="26" fill="#fbf4ea"/><ellipse cx="-12" cy="-50" rx="12" ry="9" fill="#a86a42"/><ellipse cx="18" cy="-38" rx="9" ry="7" fill="#a86a42"/>
      <rect x="-34" y="-26" width="8" height="26" fill="#efe4d4"/><rect x="-16" y="-26" width="8" height="26" fill="#efe4d4"/><rect x="14" y="-26" width="8" height="26" fill="#efe4d4"/><rect x="30" y="-26" width="8" height="26" fill="#efe4d4"/>
      <ellipse cx="50" cy="-60" rx="17" ry="14" fill="#fbf4ea"/><path d="M42 -72 q-6 -14 4 -18 M58 -72 q6 -14 -4 -18" stroke="#d9b98a" stroke-width="4" fill="none"/><circle cx="54" cy="-62" r="2.5" fill="#2a1606"/></g>
    <g id="gwala"><rect x="-6" y="-40" width="12" height="40" fill="#7a4a2a"/><path d="M-22 -40 h44 l-6 -62 h-32 z" fill="#f4ead6"/><circle cx="0" cy="-118" r="18" fill="#9a6440"/>
      <path d="M-20 -126 q20 -22 40 0 q-20 -8 -40 0z" fill="#e8742c"/><rect x="-20" y="-134" width="40" height="10" rx="5" fill="#e8742c"/><line x1="26" y1="-110" x2="38" y2="0" stroke="#6b3e1e" stroke-width="5"/></g>
    <!-- Krishna, feet at (0,0), ~300 px tall. Two poses share the body. -->
    <g id="kBody">
      <path d="M-46 -132 L46 -132 L58 -6 L-58 -6 Z" fill="#f7c531"/><path d="M-46 -132 L46 -132 L44 -112 L-44 -112 Z" fill="#e2a21f"/>
      <ellipse cx="-22" cy="-3" rx="16" ry="7" fill="#3f6fd1"/><ellipse cx="22" cy="-3" rx="16" ry="7" fill="#3f6fd1"/>
      <rect x="-40" y="-222" width="80" height="96" rx="30" fill="#4a7ee0"/>
      <path d="M-38 -212 L36 -140 L28 -130 L-40 -196 Z" fill="#f2b12a"/>
      <path d="M-26 -214 q26 26 52 0" stroke="#fff4d0" stroke-width="5" fill="none" stroke-dasharray="1 9" stroke-linecap="round"/>
      <circle cx="0" cy="-262" r="44" fill="#4f86ea"/>
      <path d="M-44 -270 q4 -46 44 -48 q40 2 44 48 q-10 -24 -44 -26 q-34 2 -44 26z" fill="#1b1730"/>
      <path d="M-26 -300 h52 l-6 -22 l-10 12 l-10 -18 l-10 18 l-10 -12z" fill="#f2c14a"/>
      <g transform="translate(18 -326) rotate(18)"><ellipse cx="0" cy="-26" rx="10" ry="30" fill="#1f8a6a"/><ellipse cx="0" cy="-36" rx="7" ry="9" fill="#1f4fae"/><circle cx="0" cy="-36" r="3.5" fill="#f2c14a"/></g>
      <path d="M-18 -262 q7 6 14 0 M4 -262 q7 6 14 0" stroke="#10203f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M-10 -244 q10 8 20 0" stroke="#7a1b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-5 -296 l5 16 l5 -16" stroke="#f2c14a" stroke-width="4" fill="none"/><circle cx="-44" cy="-250" r="5" fill="#f2c14a"/><circle cx="44" cy="-250" r="5" fill="#f2c14a"/>
    </g>
    <g id="kStand"><use href="#kBody"/>
      <path d="M38 -206 q30 30 6 62" stroke="#4a7ee0" stroke-width="18" fill="none" stroke-linecap="round"/>
      <path d="M-38 -206 q-26 30 -10 64" stroke="#4a7ee0" stroke-width="18" fill="none" stroke-linecap="round"/>
      <line x1="-62" y1="-150" x2="70" y2="-170" stroke="#7a3f1c" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g id="kLift"><use href="#kBody"/>
      <path d="M38 -206 q30 30 6 62" stroke="#4a7ee0" stroke-width="18" fill="none" stroke-linecap="round"/>
      <line x1="44" y1="-146" x2="-30" y2="-168" stroke="#7a3f1c" stroke-width="9" stroke-linecap="round"/>
      <path d="M-36 -208 L-64 -300 L-70 -360" stroke="#4a7ee0" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-70" y1="-360" x2="-72" y2="-392" stroke="#4f86ea" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g id="hillShape">
      <path d="M-330 0 C-300 -120 -220 -230 -110 -250 C-40 -300 40 -300 110 -250 C220 -230 300 -120 330 0 Z" fill="url(#gHill)"/>
      <path d="M-200 -120 l40 -30 l30 20 M60 -200 l50 -26 l30 24 M120 -90 l40 -24 l26 18" stroke="#2a5a30" stroke-width="6" fill="none"/>
      <use href="#tree" x="-160" y="-150"/><use href="#tree" x="-60" y="-250" transform="scale(1)"/><use href="#tree" x="90" y="-220"/><use href="#tree" x="200" y="-110"/><use href="#tree" x="10" y="-170"/>
    </g>
  </defs>

  <!-- sky layers -->
  <rect id="skyDusk" x="0" y="0" width="1080" height="1920" fill="url(#gDusk)"/>
  <rect id="skyStorm" x="0" y="0" width="1080" height="1920" fill="url(#gStorm)" opacity="0"/>
  <rect id="skyGold" x="0" y="0" width="1080" height="1920" fill="url(#gGold)" opacity="0"/>
  <g id="sun"><circle cx="540" cy="640" r="150" fill="url(#gGlow)"/><circle cx="540" cy="640" r="90" fill="#ffd98c"/></g>
  <g id="rays" opacity="0">
    <polygon points="540,560 380,0 470,0" fill="#fff3c8" opacity=".35"/><polygon points="540,560 600,0 700,0" fill="#fff3c8" opacity=".3"/><polygon points="540,560 820,0 930,0" fill="#fff3c8" opacity=".25"/><polygon points="540,560 150,0 260,0" fill="#fff3c8" opacity=".25"/>
  </g>
  <!-- Indra in the clouds -->
  <g id="clouds" opacity="0">
    <g fill="#2a3352"><circle cx="160" cy="400" r="120"/><circle cx="330" cy="360" r="140"/><circle cx="540" cy="420" r="150"/><circle cx="760" cy="360" r="140"/><circle cx="930" cy="410" r="120"/><rect x="0" y="400" width="1080" height="140"/></g>
    <g fill="#3a4568"><circle cx="250" cy="470" r="100"/><circle cx="640" cy="490" r="110"/><circle cx="880" cy="480" r="90"/></g>
  </g>
  <g transform="translate(540 300)"><g id="indra" opacity="0">
    <circle cx="0" cy="40" r="46" fill="#f0c8a0"/><path d="M-34 6 h68 l-8 -40 l-14 18 l-12 -30 l-12 30 l-14 -18z" fill="#f2c14a"/>
    <path d="M-22 34 l14 6 M22 34 l-14 6" stroke="#3a1a10" stroke-width="5" stroke-linecap="round"/><circle cx="-14" cy="46" r="4" fill="#3a1a10"/><circle cx="14" cy="46" r="4" fill="#3a1a10"/>
    <path d="M-12 68 q12 -6 24 0" stroke="#7a1b2b" stroke-width="4" fill="none"/>
    <g transform="translate(90 40) rotate(20)"><rect x="-6" y="-60" width="12" height="120" rx="6" fill="#f2c14a"/><circle cx="0" cy="-66" r="14" fill="#f2c14a"/><circle cx="0" cy="66" r="14" fill="#f2c14a"/></g>
  </g></g>
  <polyline id="bolt" points="700,520 650,640 700,640 630,800" stroke="#fff8c0" stroke-width="10" fill="none" stroke-linejoin="round" opacity="0"/>
  <rect id="flash" x="0" y="0" width="1080" height="1920" fill="#dfe8ff" opacity="0"/>
  <!-- ground + village -->
  <rect x="0" y="1000" width="1080" height="920" fill="url(#gEarth)"/>
  <path d="M0 1000 C200 980 400 990 540 1000 C700 1010 900 985 1080 1000 L1080 1010 L0 1010Z" fill="#6b8f3a"/>
  <g id="village"><use href="#hut" x="140" y="1000"/><use href="#hut" x="250" y="1004" transform="scale(1)"/><use href="#tree" x="70" y="1000"/><use href="#tree" x="1010" y="1000"/></g>
  <!-- Govardhan hill (moves) -->
  <g id="hill" transform="translate(790 1000) scale(.62)"><use href="#hillShape"/></g>
  <!-- people & cows -->
  <g id="crowd">
    <use class="p" href="#gwala" x="300" y="1000"/><use class="p" href="#cow" x="190" y="1000"/><use class="p" href="#gwala" x="90" y="1000"/>
    <use class="p" href="#cow" x="880" y="1000" transform="translate(1800 0) scale(-1 1)"/><use class="p" href="#gwala" x="980" y="1000"/>
  </g>
  <!-- Krishna -->
  <g id="krishna" transform="translate(540 1000)"><g id="kS"><use href="#kStand"/></g><g id="kL" opacity="0"><use href="#kLift"/></g></g>
  <!-- annakut -->
  <g id="annakut" opacity="0" transform="translate(540 1000)">
    <path d="M-260 0 C-220 -90 -130 -170 0 -190 C130 -170 220 -90 260 0Z" fill="#f2a43a"/>
    <g fill="#f7d26a"><circle cx="-150" cy="-40" r="22"/><circle cx="-100" cy="-90" r="22"/><circle cx="-40" cy="-130" r="22"/><circle cx="30" cy="-140" r="22"/><circle cx="90" cy="-100" r="22"/><circle cx="150" cy="-50" r="22"/><circle cx="-60" cy="-50" r="22"/><circle cx="20" cy="-70" r="22"/><circle cx="90" cy="-30" r="22"/></g>
    <g fill="#e8742c"><circle cx="-10" cy="-170" r="18"/><circle cx="-120" cy="-20" r="16"/><circle cx="60" cy="-120" r="16"/></g>
    <g><ellipse cx="-300" cy="-6" rx="34" ry="12" fill="#b4602a"/><path d="M-300 -18 q-10 -24 0 -40 q10 16 0 40" fill="#ffd25c"/><ellipse cx="300" cy="-6" rx="34" ry="12" fill="#b4602a"/><path d="M300 -18 q-10 -24 0 -40 q10 16 0 40" fill="#ffd25c"/></g>
  </g>
  <!-- rain -->
  <g id="rainWrap" opacity="0"><g id="rain">{{RAIN}}</g></g>
</svg>

<div class="title" id="tHook">गोवर्धन पूजा</div>
<div class="sub" id="sHook">एक पहाड़ की पूजा क्यों?</div>
<div class="title" id="tGov">गोवर्धन</div>
<div class="sub" id="sGov">चारा · पानी · जीवन</div>
<div class="title" id="tFinger" style="top:290px">छोटी उंगली</div>
<div class="title" id="tAnna">अन्नकूट</div>
<div class="sub" id="sAnna">पकवानों का पहाड़</div>
<div id="counter"><div style="position:relative;height:160px">{{DAYS}}</div><div class="lab">दिन · DIN</div></div>
{{CAPS}}
<div id="nudge"><svg width="60" height="60" viewBox="0 0 60 60"><path d="M6 30 L54 8 L42 54 L30 36 Z" fill="currentColor"/></svg>दोस्त को भेजो</div>
<div id="cta"><svg style="position:absolute;left:70px;top:70px" width="96" height="96" viewBox="0 0 60 60"><path d="M6 30 L54 8 L42 54 L30 36 Z" fill="#b23a12"/></svg>
  <div class="h">भेजो!</div><div class="b">उन्हें, जो पूछते हैं:<br/>“पहाड़ की पूजा क्यों?”</div></div>

<script>
(function () {
  const T = window.T, D = window.DUR;
  const tl = gsap.timeline({ paused: true });
  const q = s => document.querySelector(s);
  // captions: each line shows from its start to the next line
  T.lines.forEach((L, i) => {
    const el = q('#cap' + i); const end = i + 1 < T.lines.length ? T.lines[i + 1].t0 - .05 : D;
    tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .22, ease: 'power2.out' }, L.t0 - .05);
    tl.to(el, { opacity: 0, duration: .15 }, end - .15);
  });
  const t = tag => T.at[tag];
  // slow camera drift on the whole stage
  tl.fromTo('#stage', { scale: 1.06, transformOrigin: '50% 55%' }, { scale: 1.0, duration: D, ease: 'none' }, 0);
  // 1 hook
  tl.fromTo('#tHook', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .5, ease: 'back.out(1.6)' }, .05);
  tl.fromTo('#sHook', { opacity: 0 }, { opacity: 1, duration: .4 }, .35);
  tl.fromTo('#hill', { scale: .5 }, { scale: .62, duration: 1.2, ease: 'power2.out' }, 0);
  tl.to(['#tHook', '#sHook'], { opacity: 0, duration: .3 }, t('indra') - .2);
  // 2 Indra worship: Indra appears in soft clouds
  tl.to('#indra', { opacity: 1, duration: .6 }, t('indra'));
  tl.fromTo('#indra', { y: -40 }, { y: 0, duration: 1.2, ease: 'sine.out' }, t('indra'));
  tl.to('#indra', { opacity: 0, duration: .4 }, t('krishna') - .1);
  // 3 Krishna points to Govardhan
  tl.fromTo('#krishna', { x: 540, opacity: 0, scale: .8, transformOrigin: '50% 100%' }, { opacity: 1, scale: 1, duration: .6, ease: 'back.out(1.7)' }, t('krishna') - .1);
  tl.to('#hill', { scale: .7, duration: .8, ease: 'sine.out' }, t('krishna') + .6);
  tl.fromTo('#tGov', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .45 }, t('krishna') + 1.0);
  tl.fromTo('#sGov', { opacity: 0 }, { opacity: 1, duration: .4 }, t('krishna') + 1.3);
  tl.to(['#tGov', '#sGov'], { opacity: 0, duration: .3 }, t('storm') - .2);
  // 4 storm
  tl.to('#skyStorm', { opacity: 1, duration: .7 }, t('storm'));
  tl.to('#sun', { opacity: 0, duration: .5 }, t('storm'));
  tl.to('#clouds', { opacity: 1, duration: .6 }, t('storm'));
  tl.fromTo('#clouds', { y: -120 }, { y: 0, duration: 1.2, ease: 'power2.out' }, t('storm'));
  tl.to('#indra', { opacity: 1, duration: .4 }, t('storm') + .4);
  tl.to('#rainWrap', { opacity: .85, duration: .5 }, t('storm') + .3);
  const rainEnd = t('end') + .4, rainStart = t('storm') + .3, n = Math.ceil((rainEnd - rainStart) / .35);
  tl.fromTo('#rain', { y: -240 }, { y: 0, duration: .35, ease: 'none', repeat: n }, rainStart);
  [0.9, 2.1, 3.4].forEach(dt => { tl.set(['#flash', '#bolt'], { opacity: .8 }, t('storm') + dt); tl.set(['#flash'], { opacity: 0 }, t('storm') + dt + .07); tl.set('#bolt', { opacity: 0 }, t('storm') + dt + .16); });
  tl.to('#indra', { opacity: 0, duration: .4 }, t('lift'));
  // 5 lift: hill flies onto Krishna's little finger
  tl.set('#kS', { opacity: 0 }, t('lift') + .15); tl.set('#kL', { opacity: 1 }, t('lift') + .15);
  tl.to('#hill', { attr: { transform: 'translate(470 618) scale(.95)' }, duration: 1.1, ease: 'power3.inOut' }, t('lift') + .25);
  tl.fromTo('#root', { x: 0 }, { x: 10, duration: .05, repeat: 7, yoyo: true, ease: 'none' }, t('lift') + 1.3);
  tl.fromTo('#tFinger', { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: .45, ease: 'back.out(2)' }, t('lift') + 1.4);
  tl.to('#tFinger', { opacity: 0, duration: .3 }, t('shelter') - .1);
  // 6 shelter: crowd walks under the hill
  const ps = document.querySelectorAll('#crowd .p'); const dest = [470, 410, 350, 600, 660];
  ps.forEach((p, i) => tl.to(p, { attr: { x: i === 3 ? 1800 - dest[i] : dest[i] }, duration: 1.4, ease: 'sine.inOut' }, t('shelter') + i * .12));
  // 7 seven days counter: day/night tint pulses
  tl.to('#counter', { opacity: 1, duration: .3 }, t('days'));
  const dd = (T.lines[T.idx.days].dur) / 7;
  for (let k = 1; k <= 7; k++) { const at = t('days') + (k - 1) * dd; tl.set('#d' + k, { opacity: 1 }, at); if (k > 1) tl.set('#d' + (k - 1), { opacity: 0 }, at);
    tl.fromTo('#d' + k, { scale: 1.3 }, { scale: 1, duration: .25 }, at); tl.to('#skyStorm', { opacity: k % 2 ? 1 : .8, duration: dd * .8 }, at); }
  tl.to('#counter', { opacity: 0, duration: .3 }, t('end') - .1);
  // 8 the end of the storm
  tl.to(['#clouds', '#rainWrap'], { opacity: 0, duration: .8 }, t('end') + .3);
  tl.to('#skyStorm', { opacity: 0, duration: .9 }, t('end') + .3);
  tl.to('#skyGold', { opacity: 1, duration: 1 }, t('end') + .3);
  tl.to('#sun', { opacity: 1, duration: .8 }, t('end') + .5);
  tl.to('#rays', { opacity: 1, duration: .8 }, t('end') + .7);
  // 9 annakut: hill goes back, food mountain appears
  tl.to('#hill', { attr: { transform: 'translate(820 1000) scale(.6)' }, duration: 1.0, ease: 'power2.inOut' }, t('annakut'));
  tl.set('#kL', { opacity: 0 }, t('annakut') + .4); tl.set('#kS', { opacity: 1 }, t('annakut') + .4);
  tl.to('#krishna', { attr: { transform: 'translate(250 1000)' }, duration: .8, ease: 'sine.inOut' }, t('annakut') + .2);
  tl.fromTo('#annakut', { opacity: 0, scale: .6, transformOrigin: '50% 100%' }, { opacity: 1, scale: 1, duration: .7, ease: 'back.out(1.6)' }, t('annakut') + .6);
  tl.fromTo('#tAnna', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .45 }, t('annakut') + .9);
  tl.fromTo('#sAnna', { opacity: 0 }, { opacity: 1, duration: .4 }, t('annakut') + 1.2);
  tl.to(['#tAnna', '#sAnna'], { opacity: 0, duration: .3 }, t('cta') - .1);
  // nudge (38%), blinking 4.5 s
  const na = D * .38; tl.fromTo('#nudge', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: .35, ease: 'back.out(1.6)' }, na);
  for (let k = 0; k < 10; k++) tl.set('#nudge', { className: k % 2 ? '' : 'inv' }, na + .45 * (k + 1));
  tl.set('#nudge', { className: '' }, na + 4.6); tl.to('#nudge', { opacity: 0, duration: .3 }, na + 4.5);
  // CTA card
  tl.fromTo('#cta', { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: .45, ease: 'back.out(1.5)' }, t('cta'));
  window.__timelines = window.__timelines || {}; window.__timelines['govardhan'] = tl;
})();
</script>
